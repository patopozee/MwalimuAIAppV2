[server]
headless = true           # 🌟 FIXED: Keep active to enforce safe domain access
enableStaticServing = true  # 🌟 FIXED: Keeps cross-site cookie defense fully operational
maxMessageSize = 50
enableCORS = false
enableXsrfProtection = false
port = 8080
address = "0.0.0.0"

[client]
# Disables massive development tracking overhead strings, speeding up browser render paint times.
showErrorDetails = false
toolbarMode = "minimal"

[runner]
# 🚀 MODERN REPLACEMENT ENGINES:
# Disables magic parsing to reduce CPU overhead and accelerate layout calculations.
magicEnabled = false

[browser]
gatherUsageStats = false

